<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>English Quest — Learn English as a Game</title>
<meta name="description" content="Master English grammar and vocabulary through a gamified, level-based learning adventure."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ENGLISH QUEST — styles.css
   Theme: a night sky atlas. Topics are stars; mastery lights them.
   ============================================================ */
:root{
  --bg:#0B1230;
  --bg-panel:#141B3F;
  --bg-panel-2:#1B2350;
  --bg-panel-3:#232C5E;
  --line:rgba(255,255,255,0.09);
  --text:#E9ECFB;
  --text-dim:#909BC7;
  --text-dimmer:#6A75A6;

  --teal:#4FD1C5;
  --gold:#F0B84B;
  --violet:#A78BFA;
  --coral:#FF6F6F;
  --nova:#FF9A5A;

  --c-teal:var(--teal);
  --c-gold:var(--gold);
  --c-violet:var(--violet);
  --c-coral:var(--coral);
  --c-nova:var(--nova);

  --good:#57D68D;
  --bad:#FF6F6F;

  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;

  --radius:16px;
  --radius-sm:10px;
  --shadow-glow:0 0 0 rgba(0,0,0,0);
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(79,209,197,0.08), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(167,139,250,0.10), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.55;
  min-height:100vh;
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
h1,h2,h3{ font-family:var(--font-display); font-weight:600; margin:0 0 .4em; letter-spacing:-0.01em; }
p{ margin:0 0 .8em; color:var(--text-dim); }
button{ font-family:inherit; cursor:pointer; }
button:disabled{ cursor:not-allowed; opacity:.5; }
.icon{ display:inline-flex; width:1em; height:1em; vertical-align:-0.15em; }
.icon svg{ width:100%; height:100%; }

#root{ max-width:1080px; margin:0 auto; padding:0 20px 90px; min-height:100vh; }

/* ---------------- Topbar ---------------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:20px 0 18px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:8px; cursor:pointer; }
.brand-mark{ color:var(--gold); width:22px; height:22px; }
.brand-name{ font-family:var(--font-display); font-size:1.3rem; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--gold); }
.main-nav{ display:flex; gap:4px; background:var(--bg-panel); border:1px solid var(--line); border-radius:999px; padding:4px; }
.nav-btn{ background:none; border:none; color:var(--text-dim); padding:8px 16px; border-radius:999px; font-size:.92rem; font-weight:600; transition:.2s; }
.nav-btn.active{ background:var(--bg-panel-3); color:var(--text); }
.nav-btn:hover{ color:var(--text); }
.stats-pill{ display:flex; gap:10px; align-items:center; }
.stat{ display:flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:.82rem; color:var(--text-dim); background:var(--bg-panel); border:1px solid var(--line); padding:6px 10px; border-radius:999px; }
.stat .icon{ color:var(--gold); width:.95em; height:.95em; }
.stat b{ color:var(--text); font-weight:700; }
.stat.lvl{ color:var(--text); font-weight:700; }

.mobile-tabbar{ display:none; }

/* ---------------- Hero / Home ---------------- */
.hero{
  display:grid; grid-template-columns:1fr auto; gap:28px; align-items:center;
  background:linear-gradient(160deg, var(--bg-panel), var(--bg-panel-2));
  border:1px solid var(--line); border-radius:24px; padding:36px; margin:10px 0 26px;
  position:relative; overflow:hidden;
}
.hero::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(2px 2px at 20% 30%, #fff8, transparent),
    radial-gradient(2px 2px at 75% 60%, #fff6, transparent),
    radial-gradient(1.5px 1.5px at 50% 15%, #fff5, transparent),
    radial-gradient(1.5px 1.5px at 90% 80%, #fff5, transparent),
    radial-gradient(1.5px 1.5px at 10% 85%, #fff5, transparent);
}
.eyebrow{ text-transform:uppercase; letter-spacing:.12em; font-size:.75rem; color:var(--gold); font-weight:700; margin:0 0 .5em; }
.hero h1{ font-size:2.1rem; max-width:16ch; }
.hero-sub{ max-width:46ch; }
.hero-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; }
.hero-ring{ position:relative; display:flex; align-items:center; justify-content:center; }

.btn{ border:none; border-radius:12px; padding:12px 20px; font-weight:700; font-size:.95rem; display:inline-flex; align-items:center; gap:8px; transition:.15s; }
.btn .icon{ width:1em; height:1em; }
.btn-primary{ background:var(--gold); color:#241a04; }
.btn-primary:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 6px 18px rgba(240,184,75,.28); }
.btn-ghost{ background:var(--bg-panel-3); color:var(--text); border:1px solid var(--line); }
.btn-ghost:hover{ background:var(--bg-panel-2); }
.btn-disabled{ background:var(--bg-panel-3); color:var(--text-dimmer); }
.btn-small{ padding:9px 14px; font-size:.85rem; width:100%; justify-content:center; }

.xp-ring{ transform:rotate(-90deg); flex:none; }
.ring-track{ fill:none; stroke:var(--bg-panel-3); stroke-width:8; }
.ring-fill{ fill:none; stroke:var(--gold); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .6s ease; }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18%; box-sizing:border-box; overflow:hidden; line-height:1.2; }
.ring-level{ font-family:var(--font-display); font-size:1.4rem; font-weight:700; line-height:1.1; }
.ring-title{ font-size:.72rem; color:var(--text-dim); max-width:9ch; overflow-wrap:break-word; word-break:break-word; }
.ring-xp{ font-family:var(--font-mono); font-size:.65rem; color:var(--text-dimmer); margin-top:2px; white-space:nowrap; }

.quickstats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
.stat-card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
.stat-icon{ color:var(--teal); width:22px; height:22px; }
.stat-value{ font-family:var(--font-display); font-size:1.3rem; font-weight:700; }
.stat-label{ font-size:.78rem; color:var(--text-dim); }

.home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:10px; }
.home-card{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:18px; padding:24px;
  cursor:pointer; transition:.2s; border-left:4px solid var(--nc, var(--gold));
}
.home-card[data-color="teal"]{ --nc:var(--teal); }
.home-card[data-color="gold"]{ --nc:var(--gold); }
.home-card[data-color="violet"]{ --nc:var(--violet); }
.home-card[data-color="coral"]{ --nc:var(--coral); }
.home-card[data-color="nova"]{ --nc:var(--nova); }
.home-card:hover{ transform:translateY(-2px); background:var(--bg-panel-2); }
.kicker{ text-transform:uppercase; font-size:.7rem; letter-spacing:.1em; color:var(--nc, var(--gold)); font-weight:700; margin-bottom:.5em; }
.home-card h3{ font-size:1.2rem; margin-bottom:.3em; }
.home-card-sub{ font-size:.88rem; margin-bottom:1em; }
.home-card-cta{ font-weight:700; font-size:.85rem; display:inline-flex; align-items:center; gap:6px; color:var(--text); }
.home-card-cta .icon{ width:.9em; height:.9em; }

/* ---------------- Page head ---------------- */
.page-head{ padding:8px 0 20px; }
.page-head h1{ font-size:1.8rem; }
.page-sub{ max-width:60ch; }
.back-link{ background:none; border:none; color:var(--text-dim); font-weight:700; padding:14px 0 0; display:inline-flex; gap:6px; align-items:center; font-size:.88rem; }
.back-link .icon{ transform:rotate(180deg); width:.9em; height:.9em; }
.back-link:hover{ color:var(--text); }

/* ---------------- Level divider / constellation path ---------------- */
.level-divider{
  display:flex; align-items:center; gap:16px; margin:30px 0 14px; padding:14px 18px;
  background:var(--bg-panel); border:1px dashed var(--line); border-radius:14px;
  border-left:4px solid var(--nc,var(--gold));
}
.level-divider[data-color="teal"]{ --nc:var(--teal); }
.level-divider[data-color="gold"]{ --nc:var(--gold); }
.level-divider[data-color="violet"]{ --nc:var(--violet); }
.level-divider[data-color="coral"]{ --nc:var(--coral); }
.level-divider[data-color="nova"]{ --nc:var(--nova); }
.level-num{ font-family:var(--font-mono); font-size:.72rem; color:var(--nc); border:1px solid var(--nc); padding:3px 9px; border-radius:999px; white-space:nowrap; }
.level-divider h2{ font-size:1.05rem; margin:0; }
.level-divider p{ font-size:.8rem; margin:0; }
.level-count{ margin-left:auto; font-family:var(--font-mono); font-size:.85rem; color:var(--text-dim); white-space:nowrap; }

.constellation-path{ list-style:none; margin:0 0 10px; padding:0; position:relative; }
.constellation-path::before{
  content:''; position:absolute; left:23px; top:6px; bottom:6px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px);
}
.topic-node{
  position:relative; display:flex; align-items:center; gap:16px; padding:14px 16px 14px 0;
  border-radius:14px; transition:.15s;
}
.topic-node[data-action]{ cursor:pointer; }
.topic-node[data-action]:hover{ background:var(--bg-panel); }
.node-star{
  flex:none; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--bg-panel-2); border:2px solid var(--line); color:var(--text-dimmer); z-index:1;
}
.topic-node.unlocked .node-star, .topic-node.progress .node-star{
  color:#241a04; background:var(--nc,var(--gold)); border-color:var(--nc,var(--gold));
  box-shadow:0 0 0 4px rgba(240,184,75,.15), 0 0 18px rgba(240,184,75,.35);
}
.topic-node[data-color="teal"] .node-star{ --nc:var(--teal); }
.topic-node[data-color="gold"] .node-star{ --nc:var(--gold); }
.topic-node[data-color="violet"] .node-star{ --nc:var(--violet); }
.topic-node[data-color="coral"] .node-star{ --nc:var(--coral); }
.topic-node[data-color="nova"] .node-star{ --nc:var(--nova); }
.topic-node.mastered .node-star{ background:var(--good); border-color:var(--good); color:#06210f; box-shadow:0 0 18px rgba(87,214,141,.4); }
.node-star .icon{ width:20px; height:20px; }
.node-info{ display:flex; flex-direction:column; gap:2px; }
.node-title{ font-weight:700; }
.node-sub{ font-size:.8rem; color:var(--text-dim); }
.node-arrow{ margin-left:auto; color:var(--text-dimmer); width:16px; height:16px; }
.topic-node.locked .node-title{ color:var(--text-dimmer); }

/* ---------------- Lesson & quiz cards ---------------- */
.lesson-wrap{ display:flex; flex-direction:column; gap:16px; margin-bottom:30px; }
.lesson-card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:16px; padding:22px 24px; }
.lesson-card h3{ font-size:1.05rem; color:var(--gold); }
.examples{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
.example{ display:flex; gap:8px; align-items:flex-start; background:var(--bg-panel-2); border-radius:10px; padding:10px 12px; font-size:.9rem; color:var(--text); }
.example .icon{ color:var(--teal); width:.9em; height:.9em; margin-top:.3em; flex:none; }

.quiz-section h2{ font-size:1.15rem; margin-bottom:14px; }
.quiz-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
.quiz-card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:8px; }
.quiz-card.passed{ border-color:rgba(87,214,141,.4); }
.quiz-card-top{ display:flex; align-items:center; justify-content:space-between; }
.quiz-diff-badge{ font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; background:var(--bg-panel-3); padding:4px 10px; border-radius:999px; }
.done-check{ color:var(--good); }
.quiz-desc{ font-size:.85rem; margin:0; }
.quiz-status{ font-size:.78rem; color:var(--text-dimmer); margin:0 0 6px; }

/* ---------------- Quiz screen ---------------- */
.quiz-screen{ max-width:640px; margin:0 auto; padding:10px 0 40px; }
.quiz-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.quiz-title{ font-weight:700; }
.quiz-sub-badge{ font-family:var(--font-mono); font-size:.75rem; color:var(--text-dim); background:var(--bg-panel); padding:4px 10px; border-radius:999px; }
.progress-track{ height:8px; background:var(--bg-panel-3); border-radius:999px; overflow:hidden; margin-bottom:8px; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--teal), var(--gold)); transition:width .3s; }
.q-count{ font-size:.8rem; color:var(--text-dimmer); }
.q-text{ font-size:1.3rem; margin:.4em 0 1.1em; }
.options{ display:flex; flex-direction:column; gap:10px; }
.opt-btn{ text-align:left; background:var(--bg-panel); border:1px solid var(--line); color:var(--text); padding:14px 16px; border-radius:12px; font-size:.98rem; transition:.15s; }
.opt-btn:hover:not(:disabled){ background:var(--bg-panel-2); border-color:var(--text-dimmer); }
.opt-btn.selected{ border-color:var(--gold); background:var(--bg-panel-2); }
.opt-btn.correct{ border-color:var(--good); background:rgba(87,214,141,.12); }
.opt-btn.incorrect{ border-color:var(--bad); background:rgba(255,111,111,.12); }
.fill-wrap{ margin-bottom:6px; }
.fill-input{ width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:var(--bg-panel); color:var(--text); font-size:1rem; }
.fill-input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
.fill-feedback{ font-size:.85rem; }
.feedback{ margin:14px 0; font-weight:700; display:flex; align-items:center; gap:8px; }
.feedback.good{ color:var(--good); }
.feedback.bad{ color:var(--bad); }
.quiz-actions{ margin-top:16px; }

/* ---------------- Result screen ---------------- */
.result-screen{ max-width:520px; margin:20px auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; }
.result-ring{ position:relative; margin-bottom:8px; }
.result-screen h1{ font-size:1.7rem; }
.result-msg{ max-width:40ch; }
.result-xp{ font-family:var(--font-mono); font-weight:700; color:var(--gold); }
.result-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
.new-badges{ margin:10px 0; }
.new-badges-label{ font-weight:700; color:var(--gold); font-size:.85rem; }
.badge-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

.vocab-tools{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:26px; }
.tool-card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
.tool-card[data-action]{ cursor:pointer; }
.tool-icon{ width:26px; height:26px; color:var(--gold); }
.tool-card h3{ font-size:1rem; margin-bottom:.2em; }
.tool-card p{ font-size:.82rem; margin-bottom:0; }
.tool-card .btn{ align-self:stretch; }

/* ---------------- Vocabulary ---------------- */
.vocab-tabs{ display:flex; gap:8px; margin-bottom:20px; }
.vtab{ background:var(--bg-panel); border:1px solid var(--line); color:var(--text-dim); padding:9px 18px; border-radius:999px; font-weight:700; font-size:.88rem; display:inline-flex; align-items:center; gap:6px; }
.vtab.active{ background:var(--gold); color:#241a04; border-color:var(--gold); }
.vtab.disabled{ color:var(--text-dimmer); }
.empty-note{ background:var(--bg-panel); border:1px dashed var(--line); border-radius:14px; padding:28px; text-align:center; color:var(--text-dim); }
.vocab-quiz-intro{ background:var(--bg-panel); border-radius:16px; padding:24px; text-align:center; }
.vocab-quiz-intro .btn{ margin-top:10px; }

.flashcard{ perspective:1200px; height:230px; max-width:440px; margin:0 auto 18px; cursor:pointer; }
.flashcard-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s; }
.flashcard.flipped .flashcard-inner{ transform:rotateY(180deg); }
.flashcard-face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; padding:26px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border:1px solid var(--line); }
.flashcard-face.front{ background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel)); }
.flashcard-face.back{ background:linear-gradient(160deg, var(--bg-panel-3), var(--bg-panel-2)); transform:rotateY(180deg); }
.fc-pos{ font-family:var(--font-mono); font-size:.75rem; color:var(--gold); margin-bottom:6px; }
.flashcard-face.front h2{ font-size:2rem; }
.fc-hint{ font-size:.78rem; color:var(--text-dimmer); }
.flashcard-face.back h3{ font-size:1.3rem; color:var(--gold); }
.fc-meaning{ font-weight:600; color:var(--text); }
.fc-example{ font-style:italic; font-size:.88rem; }
.fc-syn{ font-size:.78rem; color:var(--text-dimmer); }
.card-dots{ display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
.dot{ width:10px; height:10px; border-radius:50%; background:var(--bg-panel-3); border:1px solid var(--line); padding:0; }
.dot.seen{ background:var(--teal); border-color:var(--teal); }
.dot.active{ box-shadow:0 0 0 3px rgba(240,184,75,.3); }
.card-nav{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:8px; }
.card-nav .btn-small{ width:auto; }
.card-progress{ font-family:var(--font-mono); font-size:.85rem; color:var(--text-dim); }
.learned-note{ text-align:center; font-size:.85rem; color:var(--good); font-weight:700; }
.learned-note.dim{ color:var(--text-dimmer); font-weight:500; }

/* ---------------- Progress page ---------------- */
.progress-top{ display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:center; margin-bottom:30px; }
.progress-ring-card{ position:relative; display:flex; flex-direction:column; align-items:center; }
.ring-caption{ font-size:.75rem; color:var(--text-dimmer); margin-top:8px; text-align:center; max-width:16ch; }
.progress-mini-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.progress-section{ margin-bottom:30px; }
.progress-section h2{ font-size:1.05rem; margin-bottom:12px; }
.bar-list{ display:flex; flex-direction:column; gap:10px; }
.bar-row{ display:grid; grid-template-columns:120px 1fr 50px; align-items:center; gap:10px; }
.bar-label{ font-size:.85rem; color:var(--text-dim); }
.bar-track{ height:9px; background:var(--bg-panel-3); border-radius:999px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:999px; background:var(--gold); transition:width .5s; }
.bar-fill[data-color="teal"]{ background:var(--teal); }
.bar-fill[data-color="gold"]{ background:var(--gold); }
.bar-fill[data-color="violet"]{ background:var(--violet); }
.bar-fill[data-color="coral"]{ background:var(--coral); }
.bar-fill[data-color="nova"]{ background:var(--nova); }
.bar-value{ font-family:var(--font-mono); font-size:.8rem; color:var(--text-dim); text-align:right; }

.badge-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:14px; }
.badge-card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:16px 12px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; }
.badge-card.earned .badge-icon{ color:var(--gold); }
.badge-card.locked{ opacity:.45; }
.badge-card.locked .badge-icon{ color:var(--text-dimmer); }
.badge-icon{ width:26px; height:26px; }
.badge-name{ font-size:.82rem; font-weight:700; }
.badge-desc{ font-size:.7rem; color:var(--text-dimmer); display:none; }
.badge-card:hover .badge-desc{ display:block; }

/* ---------------- Responsive ---------------- */
@media (max-width: 860px){
  .hero{ grid-template-columns:1fr; text-align:left; }
  .hero-ring{ justify-content:flex-start; }
  .quiz-grid{ grid-template-columns:1fr; }
  .home-grid{ grid-template-columns:1fr; }
  .vocab-tools{ grid-template-columns:1fr; }
  .progress-top{ grid-template-columns:1fr; }
  .progress-mini-stats{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width: 720px){
  .main-nav{ display:none; }
  .mobile-tabbar{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function touchStreak(){
  const today = todayStr();
  if(STATE.lastActive === today) return;
  if(!STATE.lastActive){
    STATE.streak = 1;
  } else {
    const last = new Date(STATE.lastActive.replace(/-/g,'/'));
    const now = new Date(today.replace(/-/g,'/'));
    const diffDays = Math.round((now - last) / 86400000);
    if(diffDays === 1) STATE.streak += 1;
    else if(diffDays > 1) STATE.streak = 1;
  }
  STATE.lastActive = today;
  if(STATE.streak > STATE.longestStreak) STATE.longestStreak = STATE.streak;
  checkStreakBadges();
  saveState();
}

function addXP(n){
  STATE.xp += n;
  saveState();
}
function userLevelInfo(){
  const perLevel = 150;
  const lvl = Math.floor(STATE.xp / perLevel);
  const into = STATE.xp % perLevel;
  const title = LEVEL_TITLES[Math.min(lvl, LEVEL_TITLES.length-1)];
  return { level: lvl+1, title, into, need: perLevel, pct: Math.round((into/perLevel)*100) };
}
function awardBadge(id){
  if(!STATE.badges.includes(id)){
    STATE.badges.push(id);
    saveState();
    return true;
  }
  return false;
}
function checkStreakBadges(){
  if(STATE.streak >= 3) awardBadge('streak_3');
  if(STATE.streak >= 7) awardBadge('streak_7');
}

function topicProg(topicId){
  if(!STATE.grammar.topics[topicId]) STATE.grammar.topics[topicId] = { easy:{passed:false,best:0}, medium:{passed:false,best:0}, hard:{passed:false,best:0} };
  return STATE.grammar.topics[topicId];
}
function vocabProg(levelId){
  if(!STATE.vocab.levels[levelId]) STATE.vocab.levels[levelId] = { learned:false, quizPassed:false, best:0 };
  return STATE.vocab.levels[levelId];
}

function isTopicUnlocked(idx){ return idx <= STATE.grammar.unlockedIdx; }
function isVocabUnlocked(idx){ return idx <= STATE.vocab.unlockedIdx; }

function totalTopicsMastered(){
  return GRAMMAR_FLAT.filter(g => topicProg(g.topic.id).hard.passed).length;
}
function totalVocabLearned(){
  let n = 0;
  VOCAB_LEVELS.forEach(lv => { if(vocabProg(lv.id).learned) n += lv.words.length; });
  return n;
}
function checkMilestoneBadges(){
  const mastered = totalTopicsMastered();
  const learned = totalVocabLearned();
  if(learned >= 10) awardBadge('wordsmith_10');
  if(learned >= 25) awardBadge('wordsmith_25');
  if(VOCAB_LEVELS.every(lv => vocabProg(lv.id).quizPassed)) awardBadge('vocab_champion');
  if(GRAMMAR_LEVELS[0].topics.every(tp => topicProg(tp.id).hard.passed)) awardBadge('foundations_done');
  if(mastered >= Math.ceil(GRAMMAR_FLAT.length/2)) awardBadge('halfway_hero');
  if(mastered === GRAMMAR_FLAT.length) awardBadge('grammar_master');
}

function normalizeAnswer(s){
  return (s||'').toLowerCase().trim().replace(/[.!?]+$/,'').replace(/\s+/g,' ').replace(/['\u2019]/g,'\u2019');
}

/* ---------------- Vocabulary quiz generator ---------------- */
const VOCAB_POOL = [];
VOCAB_LEVELS.forEach(lv => lv.words.forEach(w => VOCAB_POOL.push(w)));

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function generateVocabQuiz(levelId){
  const lv = VOCAB_LEVELS.find(l=>l.id===levelId);
  const qs = [];
  lv.words.forEach((word, i) => {
    const others = shuffle(VOCAB_POOL.filter(w=>w.w!==word.w)).slice(0,3);
    if(i % 2 === 0){
      const options = shuffle([word.m, ...others.map(o=>o.m)]);
      qs.push({ t:'mcq', q:'What does "'+word.w+'" mean?', o: options, a: word.m });
    } else {
      const blanked = word.ex.replace(new RegExp(word.w, 'i'), '_____');
      const options = shuffle([word.w, ...others.map(o=>o.w)]);
      qs.push({ t:'mcq', q:'Fill in the blank: '+blanked, o: options, a: word.w });
    }
  });
  return qs;
}
function makeWordQuestion(word, altIdx){
  const others = shuffle(VOCAB_POOL.filter(w=>w.w!==word.w)).slice(0,3);
  if(altIdx % 2 === 0){
    const options = shuffle([word.m, ...others.map(o=>o.m)]);
    return { t:'mcq', q:'What does "'+word.w+'" mean?', o: options, a: word.m };
  }
  const blanked = word.ex.replace(new RegExp(word.w, 'i'), '_____');
  const options = shuffle([word.w, ...others.map(o=>o.w)]);
  return { t:'mcq', q:'Fill in the blank: '+blanked, o: options, a: word.w };
}
/* Placement test: one word sampled from every day (easy day 1 -> hard day 10) so the
   score maps directly onto how many days the learner can skip ahead. */
function generatePlacementQuiz(){
  return VOCAB_LEVELS.map((lv, i) => makeWordQuestion(pick(lv.words), i));
}
/* Cumulative review: draws from every day already marked "learned", up to 10 words,
   for ongoing reinforcement. Does not affect unlocking, only badges/XP. */
function generateCumulativeReviewQuiz(){
  const learnedWords = [];
  VOCAB_LEVELS.forEach(lv => { if(vocabProg(lv.id).learned) learnedWords.push(...lv.words); });
  const sample = shuffle(learnedWords).slice(0, Math.min(10, learnedWords.length));
  return sample.map((w,i) => makeWordQuestion(w, i));
}

/* ---------- Grammar quiz gating ---------- */
function diffUnlocked(topicId, diff){
  const p = topicProg(topicId);
  if(diff === 'easy') return true;
  if(diff === 'medium') return p.easy.passed;
  if(diff === 'hard') return p.medium.passed;
  return false;
}

function startGrammarQuiz(topicId, diff){
  if(!diffUnlocked(topicId, diff)) return;
  const g = GRAMMAR_FLAT.find(x=>x.topic.id===topicId);
  const questions = shuffle(g.topic.quizzes[diff]).map(q => q.t==='mcq' ? Object.assign({}, q, {o: shuffle(q.o)}) : q);
  UI.quiz = { kind:'grammar', topicId, diff, questions, idx:0, correct:0, selected:null, textVal:'', submitted:false };
  nav('quiz');
}
function startVocabQuiz(levelId){
  const prog = vocabProg(levelId);
  if(!prog.learned) return;
  const questions = generateVocabQuiz(levelId);
  UI.quiz = { kind:'vocab', levelId, questions, idx:0, correct:0, selected:null, textVal:'', submitted:false };
  nav('quiz');
}
function startPlacementTest(){
  const questions = generatePlacementQuiz();
  UI.quiz = { kind:'placement', questions, idx:0, correct:0, selected:null, textVal:'', submitted:false };
  nav('quiz');
}
function startCumulativeReview(){
  const learnedCount = VOCAB_LEVELS.filter(lv=>vocabProg(lv.id).learned).length;
  if(learnedCount === 0) return;
  const questions = generateCumulativeReviewQuiz();
  if(!questions.length) return;
  UI.quiz = { kind:'review', questions, idx:0, correct:0, selected:null, textVal:'', submitted:false };
  nav('quiz');
}

function selectOption(idx){
  if(!UI.quiz || UI.quiz.submitted) return;
  UI.quiz.selected = idx;
  render();
}
function setFillVal(val){
  if(!UI.quiz) return;
  UI.quiz.textVal = val;
}
function submitAnswer(){
  const quiz = UI.quiz; if(!quiz || quiz.submitted) return;
  const q = quiz.questions[quiz.idx];
  let correct;
  if(q.t === 'mcq'){
    if(quiz.selected === null || quiz.selected === undefined) return;
    correct = q.o[quiz.selected] === q.a;
  } else {
    if(!quiz.textVal || !quiz.textVal.trim()) return;
    correct = normalizeAnswer(quiz.textVal) === normalizeAnswer(q.a);
  }
  quiz.submitted = true;
  quiz.wasCorrect = correct;
  if(correct) quiz.correct += 1;
  render();
}
function nextQuestion(){
  const quiz = UI.quiz; if(!quiz) return;
  if(quiz.idx + 1 < quiz.questions.length){
    quiz.idx += 1; quiz.selected = null; quiz.textVal=''; quiz.submitted = false; quiz.wasCorrect = undefined;
    render();
  } else {
    finishQuiz();
  }
}
function finishQuiz(){
  const quiz = UI.quiz; if(!quiz) return;
  const total = quiz.questions.length;
  const score = quiz.correct / total;
  const ratioMap = { grammar: PASS_RATIO, vocab: VOCAB_PASS_RATIO, placement: PASS_RATIO, review: 0.9 };
  const ratio = ratioMap[quiz.kind] != null ? ratioMap[quiz.kind] : PASS_RATIO;
  const pass = score >= ratio - 1e-9;
  let newBadges = [];
  if(quiz.kind === 'grammar'){
    newBadges = withBadgeDiff(() => {
      const prog = topicProg(quiz.topicId);
      const already = prog[quiz.diff].passed;
      if(pass && !already){ addXP(XP[quiz.diff]); awardBadge('first_star'); }
      const pct = Math.round(score*100);
      if(pct > prog[quiz.diff].best) prog[quiz.diff].best = pct;
      if(pass) prog[quiz.diff].passed = true;
      if(pass && score === 1 && quiz.diff === 'hard') awardBadge('perfectionist');
      if(pass && quiz.diff === 'hard'){
        const gi = GRAMMAR_FLAT.findIndex(g=>g.topic.id===quiz.topicId);
        if(gi === STATE.grammar.unlockedIdx && gi+1 < GRAMMAR_FLAT.length) STATE.grammar.unlockedIdx = gi+1;
      }
      checkMilestoneBadges();
      saveState();
    });
  } else if(quiz.kind === 'vocab') {
    newBadges = withBadgeDiff(() => {
      const prog = vocabProg(quiz.levelId);
      const already = prog.quizPassed;
      if(pass && !already) addXP(XP.vocab);
      const pct = Math.round(score*100);
      if(pct > prog.best) prog.best = pct;
      if(pass) prog.quizPassed = true;
      if(pass){
        const vi = VOCAB_LEVELS.findIndex(l=>l.id===quiz.levelId);
        if(vi === STATE.vocab.unlockedIdx && vi+1 < VOCAB_LEVELS.length) STATE.vocab.unlockedIdx = vi+1;
      }
      checkMilestoneBadges();
      saveState();
    });
  } else if(quiz.kind === 'placement') {
    newBadges = withBadgeDiff(() => {
      const total = VOCAB_LEVELS.length;
      const daysEarned = Math.round(score * total);
      const newIdx = Math.max(STATE.vocab.unlockedIdx, Math.min(daysEarned, total - 1));
      STATE.vocab.unlockedIdx = newIdx;
      if(!STATE.vocab.placementDone){ addXP(20); STATE.vocab.placementDone = true; }
      if(score === 1) awardBadge('placement_ace');
      checkMilestoneBadges();
      saveState();
    });
  } else if(quiz.kind === 'review') {
    newBadges = withBadgeDiff(() => {
      const pct = Math.round(score*100);
      if(pct > STATE.vocab.reviewBest) STATE.vocab.reviewBest = pct;
      if(score >= 0.9){
        if(!STATE.vocab.reviewPassed){ addXP(25); STATE.vocab.reviewPassed = true; }
        awardBadge('vocab_reviewer');
      }
      checkMilestoneBadges();
      saveState();
    });
  }
  quiz.pass = pass; quiz.score = score; quiz.newBadges = newBadges;
  UI.view = 'quizResult';
  render();
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function esc(s){ return (s==null?'':s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function retryQuiz(){
  const quiz = UI.quiz; if(!quiz) return;
  if(quiz.kind === 'grammar') startGrammarQuiz(quiz.topicId, quiz.diff);
  else if(quiz.kind === 'vocab') startVocabQuiz(quiz.levelId);
  else if(quiz.kind === 'placement') startPlacementTest();
  else if(quiz.kind === 'review') startCumulativeReview();
}
function checkLearnComplete(){
  const prog = vocabProg(UI.vocabId);
  if(!prog.learned && UI.viewedCards.size >= 5){
    prog.learned = true;
    addXP(XP.learn);
    checkMilestoneBadges();
    saveState();
  }
}

function xpRing(pct, size){
  size = size || 108;
  const r = 46, c = 2*Math.PI*r;
  const off = c - (Math.max(0,Math.min(100,pct))/100)*c;
  return '<svg class="xp-ring" width="'+size+'" height="'+size+'" viewBox="0 0 100 100">'
    + '<circle cx="50" cy="50" r="'+r+'" class="ring-track"></circle>'
    + '<circle cx="50" cy="50" r="'+r+'" class="ring-fill" style="stroke-dasharray:'+c+';stroke-dashoffset:'+off+'"></circle>'
    + '</svg>';
}

/* ================= RENDER: GRAMMAR MAP ================= */
function renderGrammarMap(){
  let html = '<section class="page-head"><p class="eyebrow">Grammar Sky</p><h1>Fifteen constellations, five skies</h1><p class="page-sub">Master every quiz in a topic to reveal the next star on your path.</p></section>';
  GRAMMAR_LEVELS.forEach((lvl, li) => {
    const topicsInLevel = lvl.topics.length;
    const masteredInLevel = lvl.topics.filter(tp=>topicProg(tp.id).hard.passed).length;
    html += '<div class="level-divider" data-color="'+lvl.color+'">'
      + '<span class="level-num">Sky '+(li+1)+'</span>'
      + '<div><h2>'+lvl.name+'</h2><p>'+lvl.tagline+'</p></div>'
      + '<span class="level-count">'+masteredInLevel+' / '+topicsInLevel+'</span>'
      + '</div>';
    html += '<ul class="constellation-path">';
    lvl.topics.forEach(tp => {
      const g = GRAMMAR_FLAT.find(x=>x.topic.id===tp.id);
      const idx = g.topicIdx;
      const unlocked = isTopicUnlocked(idx);
      const prog = topicProg(tp.id);
      const mastered = prog.hard.passed;
      const started = prog.easy.passed || prog.medium.passed;
      let state = 'locked';
      if(mastered) state = 'mastered'; else if(unlocked) state = started ? 'progress' : 'unlocked';
      const icon = mastered ? 'check' : (unlocked ? 'star' : 'lock');
      html += '<li class="topic-node '+state+'" data-color="'+lvl.color+'" '+(unlocked?'data-action="open-topic" data-id="'+tp.id+'"':'')+'>'
        + '<span class="node-star">'+ic(icon)+'</span>'
        + '<span class="node-info"><span class="node-title">'+tp.title+'</span><span class="node-sub">'+(mastered?'Mastered \u00b7 all quizzes passed':unlocked?(started?'In progress':'Ready to begin'):'Locked \u2014 finish the previous topic')+'</span></span>'
        + (unlocked?ic('arrow','node-arrow'):'')
        + '</li>';
    });
    html += '</ul>';
  });
  return html;
}

/* ================= RENDER: TOPIC DETAIL ================= */
function renderTopicDetail(topicId){
  const g = GRAMMAR_FLAT.find(x=>x.topic.id===topicId);
  if(!g) return renderGrammarMap();
  const tp = g.topic;
  const prog = topicProg(topicId);
  const lessonHtml = tp.lesson.map(sec => ''
    + '<div class="lesson-card">'
    +   '<h3>'+sec.h+'</h3>'
    +   sec.p.map(p=>'<p>'+p+'</p>').join('')
    +   (sec.ex && sec.ex.length ? '<div class="examples">'+sec.ex.map(e=>'<div class="example">'+ic('spark')+'<span>'+e+'</span></div>').join('')+'</div>' : '')
    + '</div>').join('');
  const diffs = [
    {key:'easy', label:'Easy', desc:'Warm up with the basics'},
    {key:'medium', label:'Medium', desc:'Apply the rule in context'},
    {key:'hard', label:'Hard', desc:'Prove full mastery'}
  ];
  const quizHtml = diffs.map(d => {
    const unlocked = diffUnlocked(topicId, d.key);
    const dp = prog[d.key];
    let statusText;
    if(dp.passed) statusText = 'Passed \u00b7 best score '+dp.best+'%';
    else if(unlocked) statusText = dp.best ? ('Best score '+dp.best+'% \u2014 need 70% to pass') : 'Not attempted yet';
    else statusText = 'Locked \u2014 pass the previous quiz first';
    return '<div class="quiz-card '+(dp.passed?'passed':unlocked?'open':'locked')+'" data-diff="'+d.key+'">'
      + '<div class="quiz-card-top"><span class="quiz-diff-badge">'+d.label+'</span>'+(dp.passed?ic('check','done-check'):unlocked?'':ic('lock'))+'</div>'
      + '<p class="quiz-desc">'+d.desc+'</p>'
      + '<p class="quiz-status">'+statusText+'</p>'
      + (unlocked ? '<button class="btn btn-small btn-primary" data-action="start-quiz" data-topic="'+topicId+'" data-diff="'+d.key+'">'+(dp.passed?'Retry quiz':'Start quiz')+'</button>' : '<button class="btn btn-small btn-disabled" disabled>Locked</button>')
      + '</div>';
  }).join('');
  return ''
  + '<button class="back-link" data-action="nav" data-view="grammarMap">'+ic('arrow')+' Back to Grammar Sky</button>'
  + '<section class="page-head" data-color="'+g.levelColor+'"><p class="eyebrow">'+g.levelName+'</p><h1>'+tp.title+'</h1></section>'
  + '<div class="lesson-wrap">'+lessonHtml+'</div>'
  + '<section class="quiz-section"><h2>Prove it \u2014 pass all three to unlock the next topic</h2><div class="quiz-grid">'+quizHtml+'</div></section>';
}

/* ================= RENDER: QUIZ SCREEN ================= */
function renderQuizScreen(){
  const quiz = UI.quiz;
  if(!quiz) return renderHome();
  const q = quiz.questions[quiz.idx];
  const total = quiz.questions.length;
  let title, sub;
  if(quiz.kind === 'grammar'){
    const g = GRAMMAR_FLAT.find(x=>x.topic.id===quiz.topicId);
    title = g.topic.title;
    sub = quiz.diff.charAt(0).toUpperCase()+quiz.diff.slice(1)+' quiz';
  } else if(quiz.kind === 'vocab'){
    const vi = VOCAB_LEVELS.findIndex(l=>l.id===quiz.levelId);
    title = 'Vocabulary \u2014 Day '+(vi+1);
    sub = 'Word check';
  } else if(quiz.kind === 'placement'){
    title = 'Vocabulary Placement Test';
    sub = 'One word per day';
  } else {
    title = 'Cumulative Vocabulary Review';
    sub = 'Mixed \u00b7 all words learned';
  }
  const pct = Math.round(((quiz.idx)/total)*100);
  let optionsHtml;
  if(q.t === 'mcq'){
    optionsHtml = '<div class="options">' + q.o.map((opt, i) => {
      let cls = 'opt-btn';
      if(quiz.submitted){
        if(opt === q.a) cls += ' correct';
        else if(i === quiz.selected) cls += ' incorrect';
      } else if(quiz.selected === i) cls += ' selected';
      return '<button class="'+cls+'" data-action="select-option" data-idx="'+i+'" '+(quiz.submitted?'disabled':'')+'>'+esc(opt)+'</button>';
    }).join('') + '</div>';
  } else {
    optionsHtml = '<div class="fill-wrap"><input type="text" class="fill-input" data-action="fill-input" placeholder="Type your answer\u2026" value="'+esc(quiz.textVal)+'" '+(quiz.submitted?'disabled':'')+' autocomplete="off" autocapitalize="off" spellcheck="false"/></div>';
    if(quiz.submitted){
      optionsHtml += '<p class="fill-feedback">Correct answer: <b>'+esc(q.a)+'</b></p>';
    }
  }
  let feedback = '';
  if(quiz.submitted){
    feedback = '<div class="feedback '+(quiz.wasCorrect?'good':'bad')+'">'+(quiz.wasCorrect ? ic('check')+' Correct!' : ic('lock')+' Not quite.')+'</div>';
  }
  const canSubmit = q.t==='mcq' ? (quiz.selected !== null && quiz.selected !== undefined) : (quiz.textVal && quiz.textVal.trim().length>0);
  return ''
  + '<section class="quiz-screen">'
  +   '<div class="quiz-top"><span class="quiz-title">'+esc(title)+'</span><span class="quiz-sub-badge">'+sub+'</span></div>'
  +   '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
  +   '<p class="q-count">Question '+(quiz.idx+1)+' of '+total+'</p>'
  +   '<h2 class="q-text">'+q.q+'</h2>'
  +   optionsHtml
  +   feedback
  +   '<div class="quiz-actions">'
  +     (quiz.submitted
        ? '<button class="btn btn-primary" data-action="next-question">'+(quiz.idx+1<total?'Next question':'See results')+' '+ic('arrow')+'</button>'
        : '<button class="btn btn-primary" data-action="submit-answer" '+(canSubmit?'':'disabled')+'>Submit answer</button>')
  +   '</div>'
  + '</section>';
}

/* ================= RENDER: QUIZ RESULT ================= */
function renderQuizResult(){
  const quiz = UI.quiz;
  if(!quiz) return renderHome();
  const pct = Math.round(quiz.score*100);
  const msg = quiz.pass ? pick(PASS_MSGS) : pick(FAIL_MSGS);
  let xpLine, backAction, continueBtn = '';
  if(quiz.kind === 'grammar'){
    const g = GRAMMAR_FLAT.find(x=>x.topic.id===quiz.topicId);
    xpLine = quiz.pass ? ('+'+XP[quiz.diff]+' XP') : '+0 XP \u2014 try again to earn it';
    backAction = 'data-action="open-topic" data-id="'+quiz.topicId+'"';
    if(quiz.pass && quiz.diff==='hard'){
      const nextIdx = g.topicIdx + 1;
      if(nextIdx < GRAMMAR_FLAT.length){
        const nt = GRAMMAR_FLAT[nextIdx];
        continueBtn = '<button class="btn btn-primary" data-action="open-topic" data-id="'+nt.topic.id+'">Next topic: '+nt.topic.title+' '+ic('arrow')+'</button>';
      } else {
        continueBtn = '<button class="btn btn-primary" data-action="nav" data-view="grammarMap">You\u2019ve reached the last star! '+ic('arrow')+'</button>';
      }
    }
  } else if(quiz.kind === 'vocab') {
    xpLine = quiz.pass ? ('+'+XP.vocab+' XP') : '+0 XP \u2014 try again to earn it';
    backAction = 'data-action="open-vocab-day" data-id="'+quiz.levelId+'"';
    if(quiz.pass){
      const vi = VOCAB_LEVELS.findIndex(l=>l.id===quiz.levelId);
      if(vi+1 < VOCAB_LEVELS.length){
        continueBtn = '<button class="btn btn-primary" data-action="open-vocab-day" data-id="'+VOCAB_LEVELS[vi+1].id+'">Next day: Day '+(vi+2)+' '+ic('arrow')+'</button>';
      } else {
        continueBtn = '<button class="btn btn-primary" data-action="nav" data-view="vocabMap">You\u2019ve finished every day! '+ic('arrow')+'</button>';
      }
    }
  } else if(quiz.kind === 'placement') {
    xpLine = '+20 XP for completing the placement test';
    backAction = 'data-action="nav" data-view="vocabMap"';
    const landedIdx = STATE.vocab.unlockedIdx;
    const landedDay = Math.min(landedIdx, VOCAB_LEVELS.length-1) + 1;
    continueBtn = '<button class="btn btn-primary" data-action="open-vocab-day" data-id="'+VOCAB_LEVELS[Math.min(landedIdx, VOCAB_LEVELS.length-1)].id+'">Go to Day '+landedDay+' '+ic('arrow')+'</button>';
  } else if(quiz.kind === 'review') {
    xpLine = quiz.pass ? '+25 XP for a strong review' : 'Score 90%+ to earn review XP';
    backAction = 'data-action="nav" data-view="vocabMap"';
    continueBtn = '<button class="btn btn-ghost" data-action="nav" data-view="progress">View progress '+ic('arrow')+'</button>';
  }
  const badgesHtml = (quiz.newBadges && quiz.newBadges.length)
    ? '<div class="new-badges"><p class="new-badges-label">New badge'+(quiz.newBadges.length>1?'s':'')+' unlocked!</p><div class="badge-row">'+quiz.newBadges.map(bid=>{
        const b = BADGES.find(x=>x.id===bid);
        return '<div class="badge-card earned"><span class="badge-icon">'+ic(b.icon)+'</span><span class="badge-name">'+b.name+'</span></div>';
      }).join('')+'</div></div>'
    : '';
  let headline = quiz.pass ? 'You passed!' : 'Keep practicing';
  let ringTitle = quiz.pass ? 'Passed' : 'Not yet';
  let resultMsg = msg;
  if(quiz.kind === 'placement'){
    const landedDay = Math.min(STATE.vocab.unlockedIdx, VOCAB_LEVELS.length-1) + 1;
    headline = 'Placement complete!';
    ringTitle = 'Day '+landedDay;
    resultMsg = 'Based on your score, you\u2019ve tested into Day '+landedDay+'. Earlier days stay available any time you want a refresher.';
  } else if(quiz.kind === 'review'){
    headline = quiz.pass ? 'Sharp memory!' : 'Good practice round';
    ringTitle = pct+'%';
    resultMsg = quiz.pass ? 'You\u2019re retaining your vocabulary beautifully. Come back for another round anytime.' : 'Review reinforces memory \u2014 revisit a day\u2019s flashcards and try this again whenever you like.';
  }
  return ''
  + '<section class="result-screen '+(quiz.pass?'pass':'fail')+'">'
  +   '<div class="result-ring">'+xpRing(pct,140)+'<div class="ring-center"><span class="ring-level">'+(quiz.kind==='placement'?'':pct+'%')+'</span><span class="ring-title">'+ringTitle+'</span></div></div>'
  +   '<h1>'+headline+'</h1>'
  +   '<p class="result-msg">'+resultMsg+'</p>'
  +   '<p class="result-xp">'+xpLine+'</p>'
  +   badgesHtml
  +   '<div class="result-actions">'
  +     '<button class="btn btn-ghost" data-action="retry-quiz">'+ic('play')+' Retry quiz</button>'
  +     '<button class="btn btn-ghost" '+backAction+'>Back</button>'
  +     continueBtn
  +   '</div>'
  + '</section>';
}

    +   '<button class="btn btn-small btn-primary" data-action="start-placement-test">'+(STATE.vocab.placementDone?'Retake test':'Start test')+'</button>'
    + '</div>'
    + '<div class="tool-card" '+(reviewReady?'data-action="start-cumulative-review"':'')+'>'
    +   '<span class="tool-icon">'+ic('bulb')+'</span>'
    +   '<div><h3>Cumulative review</h3><p>'+(reviewReady?'Mixed practice from every word you\u2019ve learned so far ('+learnedDays+' day'+(learnedDays===1?'':'s')+'). Score 90%+ for a bonus.':'Learn at least one day\u2019s words to unlock a mixed review.')+'</p></div>'
    +   '<button class="btn btn-small '+(reviewReady?'btn-primary':'btn-disabled')+'" '+(reviewReady?'data-action="start-cumulative-review"':'disabled')+'>'+(STATE.vocab.reviewBest?'Review again \u00b7 best '+STATE.vocab.reviewBest+'%':'Start review')+'</button>'
    + '</div>'
    + '</div>';
  html += '<ul class="constellation-path vocab-path">';
  VOCAB_LEVELS.forEach((lv, i) => {
    const unlocked = isVocabUnlocked(i);
    const prog = vocabProg(lv.id);
    let state = 'locked';
    if(prog.quizPassed) state = 'mastered';
    else if(unlocked) state = prog.learned ? 'progress' : 'unlocked';
    const icon = prog.quizPassed ? 'check' : (unlocked ? 'book' : 'lock');
    const subText = prog.quizPassed ? 'Completed \u00b7 best '+prog.best+'%' : unlocked ? (prog.learned ? 'Words learned \u2014 quiz ready' : '5 new words waiting') : 'Locked \u2014 finish the previous day';
    html += '<li class="topic-node '+state+'" data-color="gold" '+(unlocked?'data-action="open-vocab-day" data-id="'+lv.id+'"':'')+'>'

      + '<span class="node-info"><span class="node-title">Day '+(i+1)+'</span><span class="node-sub">'+subText+'</span></span>'
      + (unlocked?ic('arrow','node-arrow'):'')
      + '</li>';
  });
  html += '</ul>';
  return html;

/* ================= RENDER: PROGRESS / ANALYTICS ================= */
function avgBest(diff){
  const vals = GRAMMAR_FLAT.map(g => topicProg(g.topic.id)[diff].best).filter(v=>v>0);
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function renderProgress(){
  const lvl = userLevelInfo();
  const mastered = totalTopicsMastered();
  const learned = totalVocabLearned();
  const vocabPassed = VOCAB_LEVELS.filter(l=>vocabProg(l.id).quizPassed).length;

  const levelBars = GRAMMAR_LEVELS.map(lv => {
    const total = lv.topics.length;
    const done = lv.topics.filter(tp=>topicProg(tp.id).hard.passed).length;
    const pct = Math.round((done/total)*100);
    return '<div class="bar-row"><span class="bar-label">'+lv.name+'</span><div class="bar-track"><div class="bar-fill" data-color="'+lv.color+'" style="width:'+pct+'%"></div></div><span class="bar-value">'+done+'/'+total+'</span></div>';
  }).join('');

  const diffLabels = [['easy','Easy'],['medium','Medium'],['hard','Hard']];
  const accuracyBars = diffLabels.map(([key,label]) => {
    const avg = avgBest(key);
    return '<div class="bar-row"><span class="bar-label">'+label+'</span><div class="bar-track"><div class="bar-fill" data-color="violet" style="width:'+(avg||0)+'%"></div></div><span class="bar-value">'+(avg!==null ? avg+'%' : '\u2014')+'</span></div>';
  }).join('');

  const badgeGrid = BADGES.map(b => {
    const earned = STATE.badges.includes(b.id);
    return '<div class="badge-card '+(earned?'earned':'locked')+'" title="'+esc(b.desc)+'">'
      + '<span class="badge-icon">'+ic(b.icon)+'</span>'
      + '<span class="badge-name">'+b.name+'</span>'
      + '<span class="badge-desc">'+b.desc+'</span>'
      + '</div>';
  }).join('');

  return ''
  + '<section class="page-head"><p class="eyebrow">Progress</p><h1>Your journey so far</h1></section>'
  + '<section class="progress-top">'
  +   '<div class="progress-ring-card">'+xpRing(lvl.pct,140)+'<div class="ring-center"><span class="ring-level">Lv '+lvl.level+'</span><span class="ring-title">'+esc(lvl.title)+'</span></div><p class="ring-caption">'+STATE.xp+' XP total \u00b7 '+lvl.into+'/'+lvl.need+' to next level</p></div>'
  +   '<div class="progress-mini-stats">'
  +     statCard('star', mastered+' / '+GRAMMAR_FLAT.length, 'Grammar topics mastered')
  +     statCard('book', learned+' / '+VOCAB_POOL.length, 'Vocabulary words learned')
  +     statCard('flame', STATE.streak+' (best '+STATE.longestStreak+')', 'Day streak')
  +     statCard('trophy', STATE.badges.length+' / '+BADGES.length, 'Badges earned')
  +   '</div>'
  + '</section>'
  + '<section class="progress-section"><h2>Grammar mastery by sky</h2><div class="bar-list">'+levelBars+'</div></section>'
  + '<section class="progress-section"><h2>Average quiz accuracy by difficulty</h2><div class="bar-list">'+accuracyBars+'</div></section>'
  + '<section class="progress-section"><h2>Vocabulary days completed</h2><div class="bar-list"><div class="bar-row"><span class="bar-label">Days passed</span><div class="bar-track"><div class="bar-fill" data-color="gold" style="width:'+Math.round((vocabPassed/VOCAB_LEVELS.length)*100)+'%"></div></div><span class="bar-value">'+vocabPassed+'/'+VOCAB_LEVELS.length+'</span></div>'
  +   '<div class="bar-row"><span class="bar-label">Best review score</span><div class="bar-track"><div class="bar-fill" data-color="violet" style="width:'+STATE.vocab.reviewBest+'%"></div></div><span class="bar-value">'+(STATE.vocab.reviewBest?STATE.vocab.reviewBest+'%':'\u2014')+'</span></div>'
  + '</div></section>'
  + '<section class="progress-section"><h2>Badge gallery</h2><div class="badge-grid">'+badgeGrid+'</div></section>';
}

/* ================= EVENT DELEGATION & INIT ================= */
function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'nav': nav(el.dataset.view); break;
    case 'open-topic': nav('topic', {topicId: el.dataset.id}); break;
    case 'start-quiz': startGrammarQuiz(el.dataset.topic, el.dataset.diff); break;
    case 'select-option': selectOption(parseInt(el.dataset.idx,10)); break;
    case 'submit-answer': submitAnswer(); break;
    case 'next-question': nextQuestion(); break;
    case 'retry-quiz': retryQuiz(); break;
    case 'open-vocab-day':
      UI.vocabId = el.dataset.id; UI.vocabTab = 'learn'; UI.cardIdx = 0; UI.viewedCards = new Set([0]); UI.flipped = false;
      nav('vocabDay');
      break;
    case 'vocab-tab': {
      const tab = el.dataset.tab;
      const prog = vocabProg(UI.vocabId);
      if(tab === 'quiz' && !prog.learned) return;
      UI.vocabTab = tab; render();
      break;
    }
    case 'card-nav': {
      const dir = parseInt(el.dataset.dir,10);
      UI.cardIdx = Math.max(0, Math.min(4, UI.cardIdx+dir));
      UI.flipped = false;
      UI.viewedCards.add(UI.cardIdx);
      checkLearnComplete();
      render();
      break;
    }
    case 'jump-dot': {
      UI.cardIdx = parseInt(el.dataset.idx,10);
      UI.flipped = false;
      UI.viewedCards.add(UI.cardIdx);
      checkLearnComplete();
      render();
      break;
    }
    case 'flip-card': UI.flipped = !UI.flipped; render(); break;
    case 'start-vocab-quiz': startVocabQuiz(el.dataset.id); break;
    case 'start-placement-test': startPlacementTest(); break;
    case 'start-cumulative-review': startCumulativeReview(); break;
  }
}
function handleInput(e){
  const el = e.target.closest('[data-action="fill-input"]');
  if(!el) return;
  setFillVal(el.value);
  const submitBtn = document.querySelector('[data-action="submit-answer"]');
  if(submitBtn) submitBtn.disabled = !(el.value && el.value.trim().length > 0);
}
function handleKeydown(e){
  if(UI.view === 'quiz' && UI.quiz){
    const quiz = UI.quiz;
    if(e.key === 'Enter'){
      if(quiz.submitted) nextQuestion();
      else submitAnswer();
    }
  }
}

document.addEventListener('DOMContentLoaded', function(){
  render();
  const root = document.getElementById('root');
  root.addEventListener('click', handleClick);
  root.addEventListener('input', handleInput);
  document.addEventListener('keydown', handleKeydown);
});

</script>
</body>
